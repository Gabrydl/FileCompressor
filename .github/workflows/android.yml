name: Android APK

# Builds the phone app from android-app/ (Kotlin engine + the android-www page) and keeps the APK as a build artifact.
# The APK is unsigned here: sign it with keys/filecompressor (tools/apk_repack.py) so it installs over the app on the phone.
on:
  push:
    paths: ["android-app/**", "android-www/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk ../FileCompressor-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FileCompressor-unsigned
          path: FileCompressor-unsigned.apk
